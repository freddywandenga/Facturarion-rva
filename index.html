<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facturation RVA – Aéroport de Gemena</title>
<meta name="theme-color" content="#0b5d8a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#14232f;--mut:#5b6b78;--line:#cfd8df;--bg:#e6ebef;--acc:#0b5d8a;--accd:#08435f}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
.panel{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto;height:100vh;position:sticky;top:0}
h1{font-size:18px;margin:0}.sub{margin:2px 0 14px;color:var(--mut);font-size:12.5px}
fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 12px;padding:8px 12px 10px}
legend{font-weight:600;padding:0 6px}
label{display:block;margin-top:7px;font-size:12.5px;color:var(--mut)}
input,select{width:100%;margin-top:2px;padding:6px 8px;border:1px solid #b7c3cc;border-radius:4px;font:inherit;color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
details{margin:0 0 12px;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
summary{cursor:pointer;font-weight:600}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
button{font:inherit;padding:7px 12px;border-radius:4px;border:1px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer}
button.p{background:var(--acc);color:#fff}button.p:hover{background:var(--accd)}
.err{border-color:#b42318;background:#fff5f4}label.rq::after{content:" *";color:#b42318}
.h{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.h button{padding:3px 8px;font-size:12px}.h span{flex:1}
#msg{font-size:12.5px;color:#1c7a3d;min-height:18px;margin-bottom:6px}
main{padding:24px;overflow:auto}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:14mm 16mm;box-shadow:0 2px 14px #0003;font:10.5pt/1.35 Arial,Helvetica,sans-serif;color:#000}
.sheet .c{text-align:center}.sheet .r{text-align:right}.sheet .b{font-weight:bold}
.top{display:flex;justify-content:flex-start;align-items:flex-start;margin:6px 0 0}
.lg{width:310px}.org{font-size:10pt}.lg img{width:250px;max-width:100%;height:auto;display:block;margin:8px auto 2px}.big{font-size:14pt}
.acc{font-size:9pt;padding-top:62px;white-space:nowrap}
.sheet h2{text-align:center;text-decoration:underline;font-size:15pt;margin:22px 0 14px}
.sheet p{margin:6px 0}.m{font-size:10pt}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #000;padding:5px 8px;vertical-align:middle}td:nth-child(2){text-align:center}td:last-child{text-align:right;white-space:nowrap;width:22%}th{text-align:left}
.sheet h3{font-size:12pt;margin:18px 0 4px}.rc th,.rc td{text-align:right}.rc th:first-child,.rc td:first-child{text-align:left}.rc td:nth-child(2){text-align:right}.rc td:last-child{width:auto}.rc tr.b td{font-weight:bold}
.tt{margin:16px 0 18px;line-height:1.45}
.nb{font-size:9pt}.cd{font-size:8.5pt}
.sg{display:flex;justify-content:space-between;gap:20px;margin-top:34px;font-weight:bold}
.sg>div{width:48%}.sg>div:last-child{width:42%;text-align:center}.sg>div:first-child{text-align:center}.sg u{display:block;margin-top:46px}.sg small{font-weight:normal;font-style:italic;font-size:7.5pt;display:block}
@media(max-width:900px){.app{display:block}.panel{height:auto;position:static}.sheet{width:100%;min-height:0}}
@media(max-width:600px){main{padding:8px}.panel{padding:12px}.sheet{padding:14px 12px;font-size:8.5pt}.sheet h2{font-size:12pt;margin:14px 0 10px}.top{flex-wrap:wrap}.lg{width:100%}.lg img{width:180px}.acc{padding-top:0;white-space:normal;width:100%;font-size:8pt;text-align:center}th,td{padding:4px 5px}.sg{gap:8px;font-size:8.5pt}.sg>div:last-child{width:46%}.sg u{margin-top:34px}}
@media print{@page{size:A4;margin:14mm}body{background:#fff}.panel{display:none}.app{display:block}main{padding:0}.sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}}
</style></head><body>
<div class="app">
<aside class="panel">
<h1>Facturation des redevances</h1><p class="sub">Régie des Voies Aériennes – Aéroport de Gemena</p>
<div class="act"><button class="p" id="pdf">Enregistrer en PDF</button><button id="save">Garder la facture</button><button id="print">Imprimer</button><button id="new">Nouvelle facture</button><button id="recapbtn">Récapitulatif</button></div>
<div id="msg" role="status"></div>
<fieldset><legend>Facture</legend><div id="f1"></div></fieldset>
<fieldset><legend>Client et vol</legend><div id="f2"></div></fieldset>
<fieldset><legend>Paiements de cette facture</legend><div id="paylist"></div>
<label>Montant payé ($)<input id="pm" type="number" step="any"></label>
<label>Date du paiement<input id="pd" type="date"></label>
<label>Mode<select id="pmode"><option>Espèces</option><option>Virement</option><option>Chèque</option><option>Mobile money</option></select></label>
<button id="padd" style="margin-top:8px">Ajouter le paiement</button></fieldset>
<details><summary>Tarifs et paramètres</summary><div id="f3"></div>
<label>Emblème (image)<input type="file" id="logo" accept="image/*"></label><button id="nologo" style="margin-top:8px">Rétablir l'emblème par défaut</button></details>
<fieldset><legend>Factures enregistrées</legend><div class="act"><button id="exp">Exporter (JSON)</button><button id="imp">Importer (JSON)</button><input type="file" id="impf" accept=".json,application/json" hidden></div><div id="hist"></div></fieldset>
</aside>
<main><div class="sheet" id="sheet"></div><div class="sheet rc-page" id="recap" hidden></div></main>
</div>
<script>
const $=i=>document.getElementById(i);
const DEF={tva:16,t1:1.6,t2:3.2,t3:4.4,route:975,stat:0.2,emb:15,form:2,sol:42,comp:20,prefix:'RVA/62.00',compte:'05100-0518201000050388-81 $ RAWBANK',chef:'ELOLEA SOMO Fabien',cmd:'MPIA BWEMBIA Rolly',cmdTitre:'Ingénieur en Aviation Civile',logo:''};
const F1=[['num','N° de facture'],['date','Date de facturation','date'],['mois','Mois','text'],['an','Année']];
const F2=[['client','Nom du client','text'],['ident','Identité (immatriculation)','text'],['mtow','Masse maximale (tonnes)'],['dist','Distance route (km)'],['heures','Stationnement (heures)'],['pax','Passagers embarqués'],['nform','Formulaires de trafic'],['nsol','Assistance au sol (quantité)'],['ncomp','Comptoirs (quantité)']];
const F3=[['tva','TVA (%)'],['t1','Atterrissage 0–25 t ($/t)'],['t2','Atterrissage 25–75 t ($/t)'],['t3','Atterrissage au-delà de 75 t ($/t)'],['route','Route : taux unitaire ($)'],['stat','Stationnement ($/t/h)'],['emb','Embarquement ($/passager)'],['form','Formulaire de trafic ($)'],['sol','Assistance au sol ($)'],['comp','Comptoir ($)'],['prefix','Préfixe du n° de facture','text'],['compte','N° de compte','text'],['chef','Chef de service administratif','text'],['cmd',"Commandant d'aéroport",'text'],['cmdTitre','Titre du commandant','text']];
const FV=F1.concat(F2);
const MOIS=['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];
const S=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg={...DEF,...S('rva_cfg',{})},hist=S('rva_hist',[]);

mk(F1,'f1','v_');mk(F2,'f2','v_');mk(F3,'f3','c_');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const f2=x=>nf.format(x).replace(/\u202f/g,'\u00a0');
const nn=x=>Number.isInteger(x)?String(x):f2(x);
const usd=x=>f2(x)+'\u00a0$';
const r2=x=>Math.round(x*100+1e-6)/100;
const dfmt=d=>{const p=(d||'').split('-');return p.length===3?`${+p[2]}/${+p[1]}/${p[0]}`:''};
/* Nombre en lettres (français) */
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
const T=['','','vingt','trente','quarante','cinquante','soixante'];
function w99(n){if(n<20)return U[n];
 if(n<70){const t=Math.floor(n/10),u=n%10;return T[t]+(u===1?' et un':u?'-'+U[u]:'')}
 if(n<80){const u=n-60;return 'soixante'+(u===11?' et onze':'-'+U[u])}
 const u=n-80;return u?'quatre-vingt-'+U[u]:'quatre-vingts'}
function w999(n,fin){const c=Math.floor(n/100),r=n%100;let s='';
 if(c)s=(c>1?U[c]+' ':'')+'cent'+(c>1&&!r&&fin?'s':'');
 if(r){let x=w99(r);if(r===80&&!fin)x='quatre-vingt';s+=(s?' ':'')+x}return s}
function words(n){if(!n)return 'zéro';const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000,p=[];
 if(m)p.push(w999(m,false)+' million'+(m>1?'s':''));
 if(k)p.push(k===1?'mille':w999(k,false)+' mille');
 if(r)p.push(w999(r,true));return p.join(' ')}
function hash(s){let a=0x811c9dc5,b=0x1b873593;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619)>>>0;b=Math.imul(b+c,2246822519)>>>0;b^=b>>>13}
 return (a.toString(16).padStart(8,'0')+(b>>>0).toString(16).padStart(8,'0')).toUpperCase()}
/* Calcul de la facture (les montants gardent leur précision, l'arrondi se fait à l'affichage) */
function calc(v,c){const w=v.mtow,R=[];
 const a1=Math.min(w,25),a2=Math.min(Math.max(w-25,0),50),a3=Math.max(w-75,0);
 const pt=[];if(a1>0)pt.push(`(${nn(a1)} × ${f2(c.t1)})`);if(a2>0)pt.push(`(${nn(a2)} × ${f2(c.t2)})`);if(a3>0)pt.push(`(${f2(a3)} × ${f2(c.t3)})`);
 R.push(['ATTERRISSAGE',pt.join(' + '),a1*c.t1+a2*c.t2+a3*c.t3]);
 R.push(['ROUTE',`(${f2(v.dist)} × ${f2(c.route)} / 100) × racine(${f2(w)} / 50)`,v.dist*c.route/100*Math.sqrt(w/50)]);
 R.push(['STATIONNEMENT',`${f2(c.stat)} × ${f2(w)} × ${nn(v.heures)} h`,c.stat*w*v.heures]);
 R.push(['EMBARQUEMENT',`${nn(v.pax)} × ${f2(c.emb)}`,v.pax*c.emb]);
 R.push(['FORMULAIRE DE TRAFIC',`${f2(v.nform)} × ${f2(c.form)}`,v.nform*c.form]);
 R.push(['ASSISTANCE AU SOL',`${f2(v.nsol)} × ${f2(c.sol)}`,v.nsol*c.sol]);
 R.push(['COMPTOIR',`${f2(c.comp)} × ${f2(v.ncomp)}`,c.comp*v.ncomp]);
 const rows=R.filter(x=>x[2]>0),ht=rows.reduce((s,x)=>s+x[2],0),tva=ht*c.tva/100,ttc=ht+tva;
 const tc=Math.round(ttc*100),d=Math.floor(tc/100),ct=tc%100;
 let txt=words(d)+' dollar'+(d>1?'s':'')+' américain'+(d>1?'s':'');
 if(ct)txt+=' et '+words(ct)+' cent'+(ct>1?'s':'');
 return {rows,ht:r2(ht),tva:r2(tva),ttc:r2(ttc),txt:txt.toUpperCase()}}

function getV(){const v={};FV.forEach(([k,,t])=>{const x=$('v_'+k).value;v[k]=t?x:(parseFloat(x)||0)});return v}
function setV(v){FV.forEach(([k])=>{$('v_'+k).value=v[k]??''})}
function readC(){F3.forEach(([k,,t])=>{const x=$('c_'+k).value;cfg[k]=t?x:(parseFloat(String(x).replace(',','.'))||0)})}
const fmt2=x=>(+x||0).toFixed(2).replace('.',',');
function setC(){F3.forEach(([k,,t])=>{$('c_'+k).value=t?cfg[k]:fmt2(cfg[k])})}
document.addEventListener('change',e=>{if(e.target.id&&e.target.id.startsWith('c_')&&e.target.inputMode==='decimal')e.target.value=fmt2(parseFloat(String(e.target.value).replace(',','.')))});
function render(){const v=getV(),c=cfg,r=calc(v,c);
 const rows=r.rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${usd(r2(x[2]))}</td></tr>`).join('');
 const code=hash([c.prefix,v.num,v.an,v.client,r.ttc,v.date].join('|'));
 $('sheet').innerHTML=`<div class="top"><div class="lg c"><div class="b org">RÉPUBLIQUE DÉMOCRATIQUE DU CONGO<br>RÉGIE DES VOIES AÉRIENNES</div>${c.logo?`<img src="${c.logo}" alt="">`:FLAG}<div class="b big">R.V.A</div><i style="font-size:9pt">Aéroport National de Gemena</i></div><div class="b acc">N° COMPTE : ${esc(c.compte)}</div></div>
<h2>FACTURE N° ${esc(c.prefix)}/${v.num}/${v.an}</h2>
<p class="m">Nom du client : ${esc(v.client)} &nbsp; Identité : ${esc(v.ident)} &nbsp; Mois : ${esc(v.mois)} &nbsp; Année : ${v.an}<br><b>Date de facturation : ${dfmt(v.date)}</b></p>
<table><tr><th>REDEVANCES</th><th class="c">MODALITÉS DE CALCUL</th><th class="r">MONTANT</th></tr>${rows}</table>
<div class="tt r">TOTAL HT : ${usd(r.ht)}<br>TVA ${nn(c.tva)} % : ${usd(r.tva)}<br><b>TOTAL TTC : ${usd(r.ttc)}</b></div>
<p class="b">Certifiée sincère et arrêtée à la somme de :</p><p class="b"><i>${r.txt}</i></p>
<p class="nb">NB : Cette facture n'est valable que pour paiement des redevances aéronautiques et extra-aéronautiques payables localement.</p>
<p class="cd b">Code de vérification : ${code}</p>
<div class="sg"><div>LE CHEF DE SERVICE ADMINISTRATIF, FINANCES ET COMMERCIAL<u>${esc(c.chef)}</u></div><div>LE COMMANDANT D'AÉROPORT<u>${esc(c.cmd)}</u><small>${esc(c.cmdTitre)}</small></div></div>`}
const render0=render;render=()=>{render0();payUI()};
const curKey=()=>{const v=getV();return v.num+'/'+v.an};
const paid=h=>(h.pay||[]).reduce((s,p)=>s+p.m,0);
const stat=h=>{const p=r2(paid(h)),t=r2(h.total);return t>0&&p>=t?'Payée':p>0?'Partielle':'Non payée'};
function saveInv(){const v=getV(),r=calc(v,cfg),{logo,...c}=cfg,k=v.num+'/'+v.an,i=hist.findIndex(h=>h.key===k),en={key:k,v,c,client:v.client,total:r.ttc,pay:i>=0?(hist[i].pay||[]):[]};
 i>=0?hist[i]=en:hist.push(en);W('rva_hist',hist);list();payUI();return k}
function payUI(){const h=hist.find(x=>x.key===curKey());
 $('paylist').innerHTML=h?`<p class="sub">Total : ${usd(h.total)} – Payé : ${usd(r2(paid(h)))} – <b>Reste : ${usd(r2(Math.max(h.total-paid(h),0)))}</b> (${stat(h)})</p>`+(h.pay||[]).map((p,i)=>`<div class="h"><span>${dfmt(p.d)} – ${usd(p.m)} – ${esc(p.mode)}</span><button data-x="${i}">Supprimer</button></div>`).join(''):"<p class=\"sub\">Enregistrez d'abord la facture (« Garder la facture ») pour suivre ses paiements.</p>";
 if(!$('recap').hidden)recap()}
$('padd').onclick=()=>{const m=parseFloat($('pm').value);if(!ok())return;
 if(!(m>0)||!$('pd').value){msg('Saisissez le montant payé (supérieur à 0) et la date du paiement',true);return}
 const k=saveInv(),h=hist.find(x=>x.key===k),reste=r2(h.total-paid(h));
 if(m>reste+0.005){msg('Le paiement dépasse le reste à payer ('+usd(reste)+')',true);return}
 (h.pay=h.pay||[]).push({d:$('pd').value,m,mode:$('pmode').value});
 W('rva_hist',hist);$('pm').value='';list();payUI();msg('Paiement ajouté')};
$('paylist').onclick=e=>{const x=e.target.dataset.x;if(x===undefined)return;const h=hist.find(z=>z.key===curKey());h.pay.splice(+x,1);W('rva_hist',hist);list();payUI()};
function grp(f){const m={};hist.forEach(h=>{const [k,l]=f(h),o=m[k]||(m[k]={lab:l,n:0,t:0,p:0});o.n++;o.t+=h.total;o.p+=paid(h)});return Object.keys(m).sort().map(k=>m[k])}
function tbl(title,first,rows){const T=rows.reduce((a,x)=>({n:a.n+x.n,t:a.t+x.t,p:a.p+x.p}),{n:0,t:0,p:0});
 const tr=x=>`<td>${esc(x.lab)}</td><td>${x.n}</td><td>${usd(r2(x.t))}</td><td>${usd(r2(x.p))}</td><td>${usd(r2(Math.max(x.t-x.p,0)))}</td>`;
 return `<h3>${title}</h3><table class="rc"><tr><th>${first}</th><th>Factures</th><th>Facturé TTC</th><th>Payé</th><th>Reste</th></tr>${rows.map(x=>'<tr>'+tr(x)+'</tr>').join('')}<tr class="b">${tr({lab:'TOTAL',...T})}</tr></table>`}
function recap(){const cl=h=>(h.client||'Sans client').trim().toUpperCase(),mi=h=>String(+h.v.an*100+MOIS.indexOf(h.v.mois)+1);
 $('recap').innerHTML='<h2>Récapitulatif des factures</h2>'+(hist.length?tbl('Par client','Client',grp(h=>[cl(h),cl(h)]))+tbl('Par mois','Mois',grp(h=>[mi(h),h.v.mois+' '+h.v.an]))+'<p style="margin-top:14px"><button id="csv">Exporter en CSV (Excel)</button></p>':'<p>Aucune facture enregistrée.</p>');
 const b=$('csv');if(b)b.onclick=csv}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',n=x=>String(r2(x)).replace('.',',');
 const L=[['N°','Date','Client','Identité','Mois','Année','Total TTC ($)','Payé ($)','Reste ($)','Statut'].map(q).join(';')];
 hist.slice().sort((a,b)=>a.v.an-b.v.an||a.v.num-b.v.num).forEach(h=>L.push([h.key,dfmt(h.v.date),h.client,h.v.ident,h.v.mois,h.v.an].map(q).concat([n(h.total),n(paid(h)),n(Math.max(h.total-paid(h),0)),q(stat(h))]).join(';')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='recapitulatif-factures-rva.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('recapbtn').onclick=()=>{const on=$('recap').hidden;$('recap').hidden=!on;$('sheet').hidden=on;$('recapbtn').textContent=on?'Retour à la facture':'Récapitulatif';if(on)recap()};

function check(){const E=[];
 const chk=(id,t,y,k)=>{const x=$(id).value.trim();let m='';
  if(x==='')m='obligatoire';
  else if(y==='date'){if(isNaN(Date.parse(x)))m='date invalide'}
  else if(!y){const n=parseFloat(x.replace(',','.'));
   if(!isFinite(n)||n<0)m='nombre positif requis';
   else if((k==='num'||k==='an')&&(!Number.isInteger(n)||n<1))m='entier requis';
   else if(k==='an'&&(n<2000||n>2100))m='année invalide';
   else if(k==='mtow'&&n<=0)m='doit être supérieur à 0';
   else if(k==='tva'&&n>100)m='maximum 100';}
  $(id).classList.toggle('err',!!m);if(m)E.push([id,t+' : '+m])};
 F1.concat(F2).forEach(([k,t,y])=>chk('v_'+k,t,y,k));
 F3.forEach(([k,t,y])=>chk('c_'+k,t,y,k));
 return E}
